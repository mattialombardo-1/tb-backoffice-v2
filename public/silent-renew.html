<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>Rinnovo Sessione</title>
</head>

<body>
  <script src="https://unpkg.com/oidc-client-ts@3.5.0/dist/browser/oidc-client-ts.min.js"></script>
  <script>
    // Questa pagina viene caricata in un iframe nascosto per rinnovare il token
    new oidc.UserManager({ response_mode: 'query' })
      .signinSilentCallback()
      .catch((err) => {
        console.error('Errore silent renew callback');
      });
  </script>
</body>

</html>
